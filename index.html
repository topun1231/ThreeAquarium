<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>水草缸 · Three.js</title><link rel="icon" href="data:,"></head>
<body><canvas id="tank" aria-label="可旋转和缩放的三维水草缸"></canvas>
<button id="panel-toggle" type="button" aria-expanded="true" aria-controls="side-panel" title="把操作栏让开，鱼缸看得更完整">收起</button>
<button id="quiet-exit" type="button" title="快捷键 H，或按 Esc">结束静观</button>
<header><div><strong>水草缸</strong><span class="badge">Three.js 迁移版</span></div><p id="setup-chip"></p><p id="status" role="status">正在读取原游戏资产…</p><button id="care-chip" type="button" aria-expanded="false" aria-controls="care-pop">正在了解虾群…</button><p id="stats"></p></header>
<div id="care-pop" hidden><p id="care" role="status">正在了解虾群…</p><div id="favorites"></div><button id="show-stars" type="button" aria-pressed="false" title="平时星标藏着，打开后在缸里一直能看见">显示收藏星标</button><p id="journal"></p></div>
<div id="shrimp-card" hidden><h2 id="selection">整缸观察</h2><label>名字<input id="shrimp-name" maxlength="16" autocomplete="off" placeholder="比如：小红" title="最多 16 个字，可以用中文"></label><div class="pair"><button id="shrimp-fav" type="button" aria-pressed="false" title="标成收藏，方便再找到">收藏</button><button id="shrimp-follow" type="button" title="镜头跟着这一只">跟随这只</button></div><p id="shrimp-detail"></p></div>
<div id="loading"><strong>正在迁入你的鱼缸</strong><p id="progress">读取场景</p></div>
<aside id="side-panel">
<div id="dock-popover" hidden>
<section class="dock-col" id="col-observe" data-dock="observe" hidden><div class="pair"><button id="pause" type="button" aria-pressed="false" title="暂停或继续模拟">暂停模拟</button></div><button id="persist-mark" type="button" aria-pressed="false" title="默认选中时轮廓光闪一下就淡掉；打开后选中的虾一直留一圈淡光">选中后一直留轮廓</button><label>行为模式<select id="action" title="用来检查动作。选中后虾会停在原地"><option value="Auto">自主行为</option><option value="Rest">休息</option><option value="Walk">步足动作</option><option value="Graze">摄食</option><option value="Groom">清洁</option><option value="RoutineSwim">游泳动作</option><option value="EscapeSwim">弹尾</option></select></label><p class="hint" id="observe-hint">R 复位 · V 俯视 · H 静观 · Esc 取消</p></section>
<section class="dock-col" id="col-scene" data-dock="scene" hidden><details id="plant-panel"><summary>水草位置</summary><button id="edit-plants" aria-pressed="false">调整水草</button><div id="plant-controls" hidden><label>选择水草<select id="plant-choice"></select></label><p>点击草选取 · Q / E 旋转<br>调整期间暂停模拟</p><button id="plant-move">移动到新位置</button><div class="pair"><button id="plant-left">左转 15°</button><button id="plant-right">右转 15°</button></div><div class="pair"><button id="plant-undo" disabled title="撤销上一次移动">撤销</button><button id="plant-redo" disabled>重做</button></div></div></details></section>
<section class="dock-col" id="col-keep" data-dock="keep" hidden><button id="save" type="button" title="立刻写入这台浏览器">保存进度</button><button id="export" type="button" title="下载 v4 进度文件">导出进度</button><label class="import">导入进度<input id="import" type="file" accept="application/json,.json" title="读入之前导出的进度"></label><small>完整造景、生长和虾群都在这份进度里。大约每 15 秒自动保存。原来的 Unity 存档不会被改动。</small></section>
</div>
<div id="dock-bar">
<button type="button" data-dock="observe" aria-expanded="false" aria-controls="dock-popover">观察</button>
<button type="button" data-dock="scene" aria-expanded="false" aria-controls="dock-popover">造景</button>
<button type="button" data-dock="keep" aria-expanded="false" aria-controls="dock-popover">存档</button>
<span class="dock-sep" aria-hidden="true"></span>
<button id="feed" type="button" aria-pressed="false" title="先对准，再点你要投放的位置">加餐</button>
<button id="quiet-watch" type="button" title="快捷键 H，静观五分钟">静观</button>
<button id="reset" type="button" title="快捷键 R，回到整缸">返回整缸</button>
</div>
</aside>
<div id="welcome" class="welcome" hidden role="dialog" aria-labelledby="welcome-title"><p id="welcome-title">先看一眼这缸虾</p><p>拖动可以转着看，滚轮拉近。点一只虾，可以给它起名、标成收藏。它们平时自己吃草叶和沉木上的生物膜，加餐只是偶尔加一餐。</p><button id="welcome-dismiss" type="button">知道了，开始看</button></div>
<footer><span id="message" role="status"></span></footer>
<script type="module" src="/src/main.js"></script></body></html>
