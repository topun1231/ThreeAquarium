<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>水草缸 · Three.js</title><link rel="icon" href="data:,"></head>
<body><canvas id="tank" aria-label="可旋转和缩放的三维水草缸"></canvas>
<button id="panel-toggle" type="button" aria-expanded="true" aria-controls="side-panel">收起</button>
<button id="quiet-exit" type="button">结束静观</button>
<header><div><strong>水草缸</strong><span class="badge">Three.js 迁移版</span></div><p id="setup-chip"></p><p id="status" role="status">正在读取原游戏资产…</p></header>
<div id="loading"><strong>正在迁入你的鱼缸</strong><p id="progress">读取场景</p></div>
<aside id="side-panel"><h2 id="selection">整缸观察</h2><p id="care" role="status">正在了解虾群…</p><p>拖动旋转 · 滚轮缩放<br>方向键平移 · R 复位 · 点击虾观察<br>投喂和轻敲玻璃会先对准，再点你要作用的位置</p><button id="reset">返回整缸</button><button id="pause" aria-pressed="false">暂停模拟</button><button id="feed" aria-pressed="false">投喂</button><label>行为模式<select id="action"><option value="Auto">自主行为</option><option value="Rest">休息</option><option value="Walk">步足动作</option><option value="Graze">摄食</option><option value="Groom">清洁</option><option value="RoutineSwim">游泳动作</option><option value="EscapeSwim">弹尾</option></select></label><details id="plant-panel"><summary>水草位置</summary><button id="edit-plants" aria-pressed="false">调整水草</button><div id="plant-controls" hidden><label>选择水草<select id="plant-choice"></select></label><p>点击草选取 · Q / E 旋转<br>调整期间暂停模拟</p><button id="plant-move">移动到新位置</button><div class="pair"><button id="plant-left">左转 15°</button><button id="plant-right">右转 15°</button></div><div class="pair"><button id="plant-undo" disabled>撤销</button><button id="plant-redo" disabled>重做</button></div></div></details><button id="save">保存游戏进度</button><button id="export">导出浏览器进度</button><label class="import">导入浏览器进度<input id="import" type="file" accept="application/json,.json"></label><small>支持完整造景、植物生长与养虾。<br>每 15 秒保存，原 Unity 存档保持独立。</small></aside>
<footer><span id="stats"></span><span id="message" role="status"></span></footer>
<script type="module" src="/src/main.js"></script></body></html>
